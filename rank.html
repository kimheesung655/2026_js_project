<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인기 메뉴 순위 - 급식어때</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo">급식어때</a>
        <div class="header-actions">
            <a href="index.html" class="header-btn">메인으로</a>
        </div>
    </div>
</header>

<main class="container" style="max-width: 800px;">
    <section class="card">
        <h2 style="font-size: 22px; margin-bottom: 20px;">이번 주 최고 인기 메뉴 순위</h2>
        
        <div class="popular-item" style="padding: 16px; margin-bottom: 12px; font-size: 16px;">
            <span><strong style="color: #d97706; margin-right: 10px;">1위</strong> 마라탕</span>
            <span class="popular-score" style="font-size: 16px;">★ 4.9</span>
        </div>

        <div class="popular-item" style="padding: 16px; margin-bottom: 12px; font-size: 16px; background: #f8fafc;">
            <span><strong style="color: #64748b; margin-right: 10px;">2위</strong> 치즈닭갈비</span>
            <span class="popular-score" style="font-size: 16px;">★ 4.7</span>
        </div>

        <div class="popular-item" style="padding: 16px; margin-bottom: 12px; font-size: 16px; background: #f8fafc;">
            <span><strong style="color: #b45309; margin-right: 10px;">3위</strong> 랍스터테일구이</span>
            <span class="popular-score" style="font-size: 16px;">★ 4.5</span>
        </div>

        <div class="popular-item" style="padding: 16px; margin-bottom: 12px; font-size: 16px; background: #f8fafc;">
            <span><strong style="color: var(--text-sub); margin-right: 10px;">4위</strong> 바비큐폭립</span>
            <span class="popular-score" style="font-size: 16px;">★ 4.3</span>
        </div>

        <div class="popular-item" style="padding: 16px; font-size: 16px; background: #f8fafc;">
            <span><strong style="color: var(--text-sub); margin-right: 10px;">5위</strong> 리코타치즈샐러드</span>
            <span class="popular-score" style="font-size: 16px;">★ 4.0</span>
        </div>
    </section>
</main>

</body>
</html>
